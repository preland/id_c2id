name: ci

# What this workflow can and cannot check, stated up front, because a green
# tick that means less than it looks like is worse than no tick.
#
# It CAN check, on a bare Ubuntu runner with only `cc`, `awk` and `git`:
#   * id's structural rules over c2id/ and crt/          (tools/lint3.sh)
#   * the differential harness                           (tests/run.sh)
#   * that the developer entry point works                (tools/check.sh)
#
# And one dependency it can only try for:
#   * tests/run.sh compiles real `id`, so it needs the id toolchain from the
#     id_development umbrella repository's idc/ submodule, on the branch that
#     carries the systems extensions (docs/ID_EXTENSIONS.md). If that branch
#     is not reachable, tests/run.sh is skipped with a notice rather than
#     failed -- an unpublished dependency is not a regression in this
#     repository.
#   * bin/idc merges the standard library, idstd, into every build, and idstd
#     is its own repository rather than a submodule of the umbrella. It is
#     cloned beside the umbrella and named with IDSTD_HOME, so which idstd a
#     build used is never a guess.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The id toolchain lives in the umbrella repository's idc/ submodule.
  ID_REPO: https://github.com/preland/id_development.git
  ID_REF: kernel-port/systems-extensions
  # The standard library bin/idc merges into every build.
  IDSTD_REPO: https://github.com/preland/idstd.git
  IDSTD_REF: master
  IDSTD_HOME: ${{ github.workspace }}/idstd

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out c2id
        uses: actions/checkout@v4
        with:
          path: c2id

      - name: Report the toolchain
        working-directory: c2id
        run: |
          echo "cc:      $(cc --version | head -1)"
          echo "awk:     $(awk --version 2>&1 | head -1)"

      # Optional, and deliberately non-fatal: clone the umbrella repository
      # (with its idc/ submodule) only if the exact branch c2id needs is
      # published. Falling back to the default branch would give a compiler
      # without `word`/`alloc`/`peek*`, which fails in a way that looks like
      # this repository is broken.
      - name: Fetch the id toolchain (optional)
        run: |
          if git ls-remote --exit-code --heads "$ID_REPO" "$ID_REF" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch "$ID_REF" \
              --recurse-submodules --shallow-submodules "$ID_REPO" id_development
            echo "cloned $ID_REF"
            git clone --quiet --depth 1 --branch "$IDSTD_REF" "$IDSTD_REPO" "$IDSTD_HOME"
            echo "cloned idstd $IDSTD_REF into $IDSTD_HOME"
          else
            echo "::notice title=id toolchain unavailable::branch $ID_REF is not published at $ID_REPO; tests/run.sh will be skipped"
          fi

      # ---- checks that need nothing but the checkout ----

      - name: id's rule of 3 (tools/lint3.sh)
        working-directory: c2id
        run: ./tools/lint3.sh

      # ---- checks that need the id compiler ----

      - name: Probe the id toolchain (tools/idprobe.sh)
        id: idprobe
        working-directory: c2id
        env:
          IDC: ${{ github.workspace }}/id_development/idc/bin/idc
        run: |
          if ./tools/idprobe.sh -v; then
            echo "usable=yes" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "usable=no" >> "$GITHUB_OUTPUT"
            if [ "$rc" -eq 1 ]; then
              echo "::error title=id toolchain is present but unusable::the checked-out id compiler does not have the systems extensions"
              exit 1
            fi
            echo "::notice title=tests/run.sh skipped::no id compiler available on this runner"
          fi

      - name: The differential harness (tests/run.sh)
        if: steps.idprobe.outputs.usable == 'yes'
        working-directory: c2id
        env:
          IDC: ${{ github.workspace }}/id_development/idc/bin/idc
        run: ./tests/run.sh

      # ---- the entry point developers actually use ----

      # Runs last so it cannot mask a more specific failure above. Skipped
      # steps are expected here; --require-all is deliberately not passed,
      # because on this runner the id compiler may legitimately be absent.
      - name: Developer entry point (tools/check.sh)
        working-directory: c2id
        env:
          IDC: ${{ github.workspace }}/id_development/idc/bin/idc
        run: ./tools/check.sh
